<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            /* top:40px; */
            /* position:static; */
            margin: 10px;
            border: 3px solid black;
            width: 100px;
            height: 75px;
        }

        .box2 {
            /* top:40px; */
            display: block;
            position: absolute;
            margin: 10px;
            border: 3px solid rgb(255, 0, 0);
            width: 100px;
            height: 75px;
        }

        .box3 {
            top: 40px;
            /* left:30px; */
            /* right:40px; */
            /* bottom:50px; */
            display: block;
            position: relative;
            margin: 10px;
            border: 3px solid rgb(76, 0, 241);
            width: 100px;
            height: 75px;
        }

        .parent {
            width: 500px;
            height: 300px;
            position: relative;
        }
        .child
        {
            position:absolute;
            top:500px;
        }
    </style>
</head>
