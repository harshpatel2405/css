<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 20px auto;
            padding: 0;
            box-sizing: border-box;
            background-color: #e9ecef
        }

        .formBox {
            /* display : flex;
            flex-direction: column; */
            /* margin-top: 20px; */
            width: 500px;
            height: 600px;
            background-color: #edf0f3;
            /* border : 2px solid rgb(202, 202, 202); */
            border-radius: 7%;
            box-shadow: 5px 5px 5px #b8b8b8, -5px -5px 5px white;
            padding: 10px;
            box-sizing: border-box;
        }

        .circleLogo {
            width: 100px;
            height: 100px;
            margin:0 auto;
            border-radius: 50%;
            border: 2px solid rgb(153, 151, 151);

            box-shadow: 5px 5px 5px gray, -5px -5px 5px white;
        }
        img{
            margin-top:-3px;
            margin-left: -2px;
            height:100px;
            width:100px;
            border-radius: 50%;
        }
        
        .company {
            /* padding-top: 10px; */
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            margin:0;
        }
        
        .company h1 {   
            color: rgb(84, 138, 2);
            line-height: 0.5;
        }

        .company p {
            font-weight: bold;
            color: rgb(18, 77, 18)
        }

        .formClass {
            display: flex;
            align-items: center;
            margin:10px 0;
        }

        input {
            border: none;
            border-radius: 25px;
            width: 100%;
            outline: none;
            height: 30px;
            padding-left: 30px;
            box-shadow: inset 5px 5px 5px #c5c5c5, inset -5px -5px 5px white;
        }

        .bottomSection {
            display: flex;
            align-items: center;
            flex-direction: column;
        }

        button {
            width: 250px;
            height: 55px;
            font-size: large;
            border-radius: 25px;
            background-color: rgb(51, 143, 51);
            color: white;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: gray
        }
    </style>
</head>

<body>
    <div class="formBox">
        <div class="circleLogo"><img src="image.png"></div>
        <div class="company">
            <h1>GeeksforGeeks</h1>
            <p>Neumorphism Login Form</p>
        </div>
        <div class="formClass">
            <form>
                <input placeholder="email">
                <br>
                <input placeholder="password">
            </form>
        </div>
        <div class="bottomSection">
            <button>GeeksforGeeks Signin</button>
            <br>
            <p>
                <a href="#">Forgot Password?</a> or
                <a href="#">Signup</a>
            </p>
        </div>
    </div>
</body>

</html>
